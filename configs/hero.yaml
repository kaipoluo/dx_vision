enemy_color: "blue"
# enemy_color: "red"


#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.7
use_traditional: true  

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 100 # 像素值阈值
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8


#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75


#####-----aimer参数-----#####
yaw_offset: -1 # degree -2.5
pitch_offset: -6 # degree 2


# 距离相关的偏移量补偿，格式为：[[距离1, yaw偏移1, pitch偏移1], [距离2, yaw偏移2, pitch偏移2], ...]
# 偏移量单位：度(若注释掉，则不使用距离补偿，直接使用aimer原偏移量)
distance_offsets:
  - [0.5, -1, -6]    # 0.5米距离
  - [1, -1.5, -7]  # 1米距离
  - [1.5, -2, -8]   # 1.5米距离
  - [2, -2.5, -9] # 2米距离
  - [2.5, -3, -10]  # 2.5米距离



comming_angle: 60 # degree
leaving_angle: 20 # degree
decision_speed: 8 # rad/s
high_speed_delay_time: 0.015 # s
low_speed_delay_time: 0.035 # s


#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

# camera_name: "hikrobot"
# exposure_ms: 5
# gain: 16
# vid_pid: "2bdf:0001"


camera_name: "dahengvision"
exposure_ms: 3  # 曝光时间(毫秒)
gamma: 15      # 伽马值
vid_pid: "2ba2:4d55"  # 大恒相机的VID:PID


#  1  0  0
#  0  1  0
#  0  0  1

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]


# 相机同理想情况的偏角: yaw-1.36 pitch0.06 roll-0.07 degree
R_camera2gimbal: [0.023738106985385032, 0.0010038438651394635, 0.99971770744257848, -0.9997174652701698, -0.0011979455137538508, 0.023739304124868833, 0.0012214378974595239, -0.9999987786112744, 0.0009751232856161085]
t_camera2gimbal: [0.097097996063446629, 0.031802662977283826, 0.10644466614239614]
# 重投影误差: 0.6080px
camera_matrix: [1273.1823770984643, 0, 623.46586109714133, 0, 1273.7469255316937, 511.73518751424609, 0, 0, 1]
distort_coeffs: [-0.08126901677538087, 0.13113098548032998, 0.00038613736170107018, -0.0014895110340408368, 0]


#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
baud_rate: 115200     # 波特率
bytesize: 8             # 数据位
parity: "none"          # 奇偶校验（none/odd/even）
stopbits: 1             # 停止位

#####-----planner-----#####
fire_thresh: 0.003
#### 成本函数：Q矩阵(状态权重)和R矩阵(控制权重)
max_yaw_acc: 50
Q_yaw: [9e4, 0]
R_yaw: [200]


max_pitch_acc: 50
Q_pitch: [9e6,100]
R_pitch: [200]