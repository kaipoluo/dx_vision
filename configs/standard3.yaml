enemy_color: "blue"
# enemy_color: "red"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
# TensorRT ONNX 模型路径（从 ONNX 自动构建 .engine 缓存）
yolo11_onnx_path: assets/yolo11.onnx
yolo11_engine_path: assets/yolo11.engine
yolov8_onnx_path: assets/yolov8.onnx
yolov8_engine_path: assets/yolov8.engine
yolov5_onnx_path: assets/yolov5.onnx
yolov5_engine_path: assets/yolov5.engine
# 旧 OpenVINO 路径（向后兼容）
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
fp16: true
min_confidence: 0.8
use_traditional: false

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -0.5 # -0.5(能用) 左移调大 degree -2.5 +  left     - right -2.4   -0.75
pitch_offset: 4.5 # 4.5（能用）上移调大 deg  （原）ree 2 正值：瞄准点向down偏移 负值：瞄准点向up偏移  -2.5

# 距离相关的偏移量补偿，格式为：[[距离1, yaw偏移1, pitch偏移1], [距离2, yaw偏移2, pitch偏移2], ...]
# 偏移量单位：度(若注释掉，则不使用距离补偿，直接使用aimer原偏移量)
distance_offsets:
  - [0.5, -1, -6]    # 0.5米距离
  - [1, -1.5, -7]  # 1米距离
  - [1.5, -2, -8]   # 1.5米距离
  - [2, -2.5, -9] # 2米距离
  - [2.5, -3, -10]  # 2.5米距离

# 小陀螺补偿参数
xtl_yaw_compensation: 0.05   # yaw补偿量
xtl_pitch_compensation: 0.02 # pitch补偿量

comming_angle: 60 # degree
leaving_angle: 20 # degree
decision_speed: 8 # rad/s
high_speed_delay_time: 0.315 # s
low_speed_delay_time: 0.010 # s 0.350

#####-----shooter参数-----#####
first_tolerance: 2 # 近距离射击容差，degree
second_tolerance: 1.5 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 2
gain: 16
vid_pid: "2bdf:0001"

# camera_name: "dahengvision"
# exposure_ms: 40
# gamma: 1.0
# vid_pid: "2ba2:4d55"

#  1  0  0
#  0  1  0
#  0  0  1

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

