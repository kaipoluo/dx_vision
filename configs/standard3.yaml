#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
baud_rate: 115200     # 波特率
bytesize: 8             # 数据位
parity: "none"          # 奇偶校验（none/odd/even）
stopbits: 1             # 停止位

#####-----planner-----#####
fire_thresh: 0.003

max_yaw_acc: 50
Q_yaw: [9e5, 0]
R_yaw: [100]

max_pitch_acc: 50
Q_pitch: [9e6,100] #响应精度
R_pitch: [200] #平滑精度
