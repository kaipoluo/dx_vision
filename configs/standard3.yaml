enemy_color: "blue"
# enemy_color: "red"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: false

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 0 # -0.5(能用) 左移调大 degree -2.5 +  left     - right -2.4   -0.75
pitch_offset: 0 # 4.5（能用）上移调大 deg  （原）ree 2 正值：瞄准点向down偏移 负值：瞄准点向up偏移  -2.5

# 距离相关的偏移量补偿，格式为：[[距离1, yaw偏移1, pitch偏移1], [距离2, yaw偏移2, pitch偏移2], ...]
# 偏移量单位：度(若注释掉，则不使用距离补偿，直接使用aimer原偏移量)
distance_offsets:
  - [0,  0,   0]    # 0.5m: yaw左偏1°, pitch上抬6°
  - [0,  0,   0]    # 1m:   yaw左偏1.5°, pitch上抬7°
  - [0,  0,  0]    # 1.5m: yaw左偏2°, pitch上抬8°
  - [0,  0,  0]    # 2m:   yaw左偏2.5°, pitch上抬9°
  - [0,  0,  0]    # 2.5m: yaw左偏3°, pitch上抬10°
# 小陀螺补偿参数
xtl_yaw_compensation: 0.05   # yaw补偿量
xtl_pitch_compensation: 0.02 # pitch补偿量

comming_angle: 60 # degree
leaving_angle: 20 # degree
decision_speed: 8 # rad/s  目标自转角速度超过它，就认为在"小陀螺"，改用下面的大延迟
high_speed_delay_time: 0.315 # s  小陀螺时的预测时间（相机+识别+发弹延迟的总和）
low_speed_delay_time: 0.010 # s  普通目标时的预测时间。调大=更超前，调小=更落后。
                            #   真实值 ≈ 从"曝光"到"云台动"的全部耗时（实测约 0.04~0.07 s）

#####-----shooter参数-----#####
first_tolerance: 2 # 近距离射击容差，degree
second_tolerance: 1.5 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 3
gain: 10
vid_pid: "2bdf:0001"

# camera_name: "dahengvision"
# exposure_ms: 40
# gamma: 1.0
# vid_pid: "2ba2:4d55"

#  1  0  0
#  0  1  0
#  0  0  1

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]


# 重投影误差: 0.1644px
camera_matrix: [2356.9926246872533, 0, 688.20295715320719, 0, 2351.8542885114948, 536.3876317978395, 0, 0, 1]
distort_coeffs: [-0.044311997772563012, 0.18817751289311019, -0.0035152416225638534, -0.0006631415079559436, 0]

# 相机同理想情况的偏角: yaw-3.93 pitch-1.39 roll4.17 degree
R_camera2gimbal: [0.066654405440647047, -0.029140746600135176, 0.99735049361944006, -0.9951218796778305, 0.070919374660369572, 0.068577597539166091, -0.072729875717036402, -0.99705629689871034, -0.024271505779732472]
t_camera2gimbal: [0.19578564824879016, 0.0089766512205295135, 0.035952303097077837]


#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
baud_rate: 115200     # 波特率
bytesize: 8             # 数据位
parity: "none"          # 奇偶校验（none/odd/even）
stopbits: 1             # 停止位

#####-----planner(MPC)-----#####
# Q = 跟踪误差的代价，R = 用力的代价。Q/R 越大 → MPC 越"凶"，越小 → 越"软"。
# R_yaw 越大越平顺但越迟钝；max_yaw_acc 是规划允许的最大角加速度(rad/s^2)。
fire_thresh: 0.05
max_yaw_acc: 30
Q_yaw: [9e6, 100]   # 第1项=位置误差权重，第2项=角速度误差权重
R_yaw: [200]        # 用力代价：调小 → 跟得紧但容易抖；调大 → 平顺但滞后

max_pitch_acc: 50   #控制
Q_pitch: [9e6,100] #响应精度
R_pitch: [200] #平滑精度
