#####-----cboard参数-----#####
# quaternion_canid: 0x100
# bullet_speed_canid: 0x101
# send_canid: 0xff
# can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
baud_rate: 115200     # 波特率
bytesize: 8             # 数据位
parity: "none"          # 奇偶校验（none/odd/even）
stopbits: 1             # 停止位

#####-----planner-----#####
fire_thresh: 0.003
#### 成本函数：Q矩阵(状态权重)和R矩阵(控制权重)
max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6,0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.520   # s
predict_time: 0.100     # s